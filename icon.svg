<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Фон (скруглённый квадрат) -->
  <rect width="512" height="512" rx="100" fill="#E8EEDC"/>

  <!-- Тело лягушки -->
  <ellipse cx="256" cy="300" rx="170" ry="145" fill="#F2E3B6" stroke="#8B9A6B" stroke-width="14"/>

  <!-- Левый глаз (основа) -->
  <circle cx="180" cy="200" r="62" fill="#F2E3B6" stroke="#8B9A6B" stroke-width="14"/>
  <!-- Правый глаз (основа) -->
  <circle cx="332" cy="200" r="62" fill="#F2E3B6" stroke="#8B9A6B" stroke-width="14"/>

  <!-- Зрачки -->
  <circle cx="180" cy="200" r="40" fill="#2C2C2C"/>
  <circle cx="332" cy="200" r="40" fill="#2C2C2C"/>

  <!-- Блики в глазах -->
  <circle cx="166" cy="186" r="13" fill="white"/>
  <circle cx="192" cy="214" r="7" fill="white"/>
  <circle cx="318" cy="186" r="13" fill="white"/>
  <circle cx="344" cy="214" r="7" fill="white"/>

  <!-- Румянец -->
  <ellipse cx="120" cy="290" rx="32" ry="20" fill="#F5AFAF" opacity="0.85"/>
  <ellipse cx="392" cy="290" rx="32" ry="20" fill="#F5AFAF" opacity="0.85"/>

  <!-- Улыбка -->
  <path d="M 200 330 Q 256 380 312 330" fill="none" stroke="#2C2C2C" stroke-width="14" stroke-linecap="round"/>

  <!-- Животик -->
